name: Build, Deploy

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_FILE: ${{ vars.RELEASE_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.RELEASESTOREPASSWORD }}
          KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASEKEYPASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "keystore.file=$KEYSTORE_FILE" >> keystore.properties
            echo "keystore.password=$STORE_PASSWORD" >> keystore.properties
            echo "keystore.key.alias=$KEY_ALIAS" >> keystore.properties
            echo "keystore.key.password=$KEY_PASSWORD" >> keystore.properties
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/4.0-dev' }}

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Read Output Metadata
        id: read_output_metadata
        run: |
          METADATA_FILE="./app/build/outputs/apk/release/output-metadata.json"
          if [ -f "$METADATA_FILE" ]; then
            VERSION_NAME=$(jq -r '.elements[0].versionName // "unknown"' "$METADATA_FILE")
            VERSION_CODE=$(jq -r '.elements[0].versionCode // "0"' "$METADATA_FILE")
          else
            VERSION_NAME="unknown"
            VERSION_CODE="0"
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        with:
          name: "release-${{ steps.read_output_metadata.outputs.version_name }}(${{ steps.read_output_metadata.outputs.version_code }})"
          path: ./app/build/outputs/apk/release

      - name: Upload Mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: ./app/build/outputs/mapping/release

      - name: Post to channel
        if: contains(github.event.head_commit.message, '[skip post]') == false && github.event_name != 'pull_request'
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_DEV_ID }}
          BOT_TOKEN: ${{ secrets.BOT_DEV_TOKEN }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: |+
            ```
            ${{ github.event.head_commit.message }}
            ```

            构建分支：[${{ github.ref }}](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }})
            构建版本：[${{ github.sha }}]("$COMMIT_URL")
          ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$CHANNEL_ID" ]; then
            export RELEASE=$(find ./app/build/outputs/apk/release -name "*.apk")
            ESCAPED=`python3 -c 'import json,os,urllib.parse; msg = json.dumps(os.environ["COMMIT_MESSAGE"]); print(urllib.parse.quote(msg if len(msg) <= 1024 else json.dumps(os.environ["COMMIT_URL"])))'`
            curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${CHANNEL_ID}&media=%5B%7B%22type%22%3A%22document%22%2C%22media%22%3A%22attach%3A%2F%2Frelease%22%2C%22parse_mode%22%3A%22MarkdownV2%22%2C%22caption%22%3A${ESCAPED}%7D%5D&reply_markup=%7B%22inline_keyboard%22%3A%20%5B%5B%7B%22text%22%3A%20%22%E5%9C%A8+Github+%E4%B8%8A%E6%9F%A5%E7%9C%8B%22%2C%20%22url%22%3A%20${ACTION_URL}%7D%5D%5D%7D" -F release="@$RELEASE"
          fi
